name: Rust

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never needs to write to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Keep `rust-version` in Cargo.toml honest: build and test with exactly that
  # toolchain. If a dependency update needs a newer Rust, this job fails and
  # `rust-version` (and the toolchain below) must be raised together.
  msrv:
    name: Minimum Rust version (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The OpenSSH interop tests generate keys with the real ssh-keygen.
      - run: ssh-keygen -V 2>&1 || ssh -V
      - run: cargo test --workspace --locked
