services:
  api:
    build:
      context: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    # PostgreSQL runs on the host and listens on 127.0.0.1 only. The API
    # reaches it through its Unix socket, so no database port is exposed to
    # any network. Read-only: connecting to a socket needs no write access.
    volumes:
      - ${RELIC_PG_SOCKET_DIR:-/var/run/postgresql}:/var/run/postgresql:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - internal
      - public
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      RELIC_HOST: ${RELIC_HOST:?RELIC_HOST must be set to the public IP or domain}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_PROFILE: ${ACME_PROFILE:-shortlived}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  # Caddy <-> API only. No route out: the API needs nothing beyond Caddy and
  # the database socket, so a compromised API cannot reach the internet.
  internal:
    internal: true
  public:

volumes:
  caddy_data:
  caddy_config:
