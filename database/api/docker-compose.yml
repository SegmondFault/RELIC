services:
  api:
    build:
      context: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - internal
      - public
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      RELIC_HOST: ${RELIC_HOST:?RELIC_HOST must be set to the public IP or domain}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_PROFILE: ${ACME_PROFILE:-shortlived}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  internal:
  public:

volumes:
  caddy_data:
  caddy_config:
