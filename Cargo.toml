[workspace]
members = [
    "crates/relic-crypto",
    "crates/relic-domain",
    "crates/relic-ingest",
    "crates/relic-integrity-worker",
    "crates/relic-mmr-worker",
    "crates/relic-object-worker",
    "experiments/relic-bloom-reference",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SegmondFault/RELIC"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
